<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Check live Powerball, Mega Millions, and EuroMillions lottery results updated instantly. View today’s winning numbers, jackpots, and draw schedules on LotteryUpdate000.space.">
  <meta name="keywords" content="lottery results, powerball, mega millions, euromillions, live draw, jackpots, winning numbers, LotteryUpdate000">
  <meta name="author" content="LotteryUpdate000.space">

  <!-- ✅ Open Graph (Facebook / WhatsApp) -->
  <meta property="og:title" content="Live Lottery Results - Powerball, Mega Millions, EuroMillions">
  <meta property="og:description" content="Get the latest Powerball, Mega Millions, and EuroMillions results updated live on LotteryUpdate000.space.">
  <meta property="og:url" content="https://lotteryupdate000.space/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://lotteryupdate000.space/images/lottery-preview.jpg">

  <!-- ✅ Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Live Lottery Results - Powerball, Mega Millions, EuroMillions">
  <meta name="twitter:description" content="Get instant lottery updates and winning numbers. Check Powerball, Mega Millions, and EuroMillions live draws now.">
  <meta name="twitter:image" content="https://lotteryupdate000.space/images/lottery-preview.jpg">

  <link rel="canonical" href="https://lotteryupdate000.space/">
  <title>Live Lottery Results - Powerball, Mega Millions, EuroMillions</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f9fb;
      color: #222;
      text-align: center;
    }
    header {
      background-color: #0047ab;
      color: #fff;
      padding: 20px;
      border-radius: 10px;
    }
    h1 {
      margin: 0;
      font-size: 1.8em;
    }
    .results {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin: 20px auto;
      padding: 20px;
      max-width: 600px;
      text-align: left;
    }
    h2 {
      color: #0047ab;
      margin-top: 0;
    }
    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #555;
    }
    a.footer-link {
      color: #0047ab;
      text-decoration: none;
      margin: 0 5px;
    }
    a.footer-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎲 Live Lottery Results</h1>
    <p>Powerball • Mega Millions • EuroMillions — Updated Live</p>
  </header>

  <main>
    <div class="results" id="powerball">
      <h2>Powerball</h2>
      <p>Loading latest draw...</p>
    </div>

    <div class="results" id="megamillions">
      <h2>Mega Millions</h2>
      <p>Loading latest draw...</p>
    </div>

    <div class="results" id="euromillions">
      <h2>EuroMillions</h2>
      <p>Loading latest draw...</p>
    </div>
  </main>

  <footer>
    © 2025 LotteryUpdate000.space · 
    <a href="privacy-policy.html" class="footer-link">Privacy Policy</a> · 
    <a href="terms-of-service.html" class="footer-link">Terms of Service</a>
  </footer>

  <script>
    // --- Powerball ---
    fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://www.powerball.com/api/v1/numbers/powerball/recent10"))
      .then(res => res.json())
      .then(data => {
        const result = JSON.parse(data.contents)[0];
        const numbers = result.winning_numbers.split(" ");
        document.getElementById("powerball").innerHTML =
          `<h2>Powerball</h2>
           <p><strong>Draw Date:</strong> ${result.draw_date}</p>
           <p><strong>Winning Numbers:</strong> ${numbers.join(", ")}</p>
           <p><strong>Jackpot:</strong> $${result.jackpot.toLocaleString()}</p>`;
      })
      .catch(() => {
        document.getElementById("powerball").innerHTML = "<p>Error loading Powerball data.</p>";
      });

    // --- Mega Millions ---
    fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://www.megamillions.com/cmspages/utilservice.asmx/GetLatestDrawData"))
      .then(res => res.json())
      .then(data => {
        document.getElementById("megamillions").innerHTML =
          `<h2>Mega Millions</h2><pre>${data.contents}</pre>`;
      })
      .catch(() => {
        document.getElementById("megamillions").innerHTML = "<p>Error loading Mega Millions data.</p>";
      });

    // --- EuroMillions ---
    fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://www.lottery.co.uk/euro-millions/results/json"))
      .then(res => res.json())
      .then(data => {
        document.getElementById("euromillions").innerHTML =
          `<h2>EuroMillions</h2><pre>${data.contents}</pre>`;
      })
      .catch(() => {
        document.getElementById("euromillions").innerHTML = "<p>Error loading EuroMillions data.</p>";
      });
  </script>
</body>
</html>
